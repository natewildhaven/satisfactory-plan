<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Satisfactory Guide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="logo">⚙</span>
      <div>
        <div class="brand-title">Satisfactory Guide</div>
        <div class="brand-sub" id="overall"></div>
      </div>
    </div>
    <nav class="tabs" id="tabs">
      <button data-view="targets">Targets</button>
      <button data-view="goals">Goals</button>
      <button data-view="now">Quests</button>
      <button data-view="list">List</button>
      <button data-view="flow">Flowchart</button>
      <button data-view="mind">Mind map</button>
      <button data-view="logistics">Logistics</button>
      <button data-view="alts">Alternates</button>
      <button data-view="rules">Rules</button>
      <button data-view="stats">Stats</button>
      <button data-view="settings" aria-label="Settings">⚙</button>
    </nav>
  </header>

  <main id="view"></main>
  <footer class="build" id="build"></footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <div id="drawer" class="drawer" hidden>
    <div class="drawer-backdrop" data-close></div>
    <aside class="drawer-panel" role="dialog" aria-modal="true">
      <button class="drawer-close" data-close aria-label="Close">✕</button>
      <div id="drawer-body"></div>
    </aside>
  </div>

  <script src="js/recipes.js"></script>
  <script src="js/solver.js"></script>
  <script src="js/missions.js"></script>
  <script src="js/goals.js"></script>
  <script src="js/comeback.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
