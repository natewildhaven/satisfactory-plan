<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Satisfactory Guide</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="logo">⚙</span>
      <div>
        <div class="brand-title">Satisfactory Guide</div>
        <div class="brand-sub" id="overall"></div>
      </div>
    </div>
    <nav class="tabs" id="tabs">
      <button data-view="now">Now</button>
      <button data-view="list">List</button>
      <button data-view="flow">Flowchart</button>
      <button data-view="mind">Mind map</button>
      <button data-view="rules">Rules</button>
      <button data-view="settings" aria-label="Settings">⚙ Settings</button>
    </nav>
  </header>

  <main id="view"></main>

  <div id="drawer" class="drawer" hidden>
    <div class="drawer-backdrop" data-close></div>
    <aside class="drawer-panel" role="dialog" aria-modal="true">
      <button class="drawer-close" data-close aria-label="Close">✕</button>
      <div id="drawer-body"></div>
    </aside>
  </div>

  <script src="js/recipes.js"></script>
  <script src="js/solver.js"></script>
  <script src="js/missions.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
